<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="XAU Quant">
  <meta name="theme-color" content="#0B0E14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>XAU Quant Terminal</title>
</head>
<body>
  <header class="header">
    <h1>XAU Quant Terminal</h1>
    <span id="sessionStatus">Sesi: Memuat...</span>
  </header>

  <nav class="tabbar">
    <button class="tabbtn active" data-tab="setup">Setup & Sinyal</button>
    <button class="tabbtn" data-tab="backtest">Backtest</button>
    <button class="tabbtn" data-tab="mtf">Analisis MTF</button>
    <button class="tabbtn" data-tab="news">Berita USD</button>
  </nav>

  <!-- Setup & Sinyal -->
  <main id="tab-setup" class="tabpane">
    <section class="card" id="indicatorsDashboard">
      <h3>Indikator Trend & Volatilitas</h3>
      <div class="grid-2">
        <div class="ind">EMA: <span id="valEma">—</span></div>
        <div class="ind">ADX: <span id="valAdx">—</span></div>
        <div class="ind">RSI: <span id="valRsi">—</span></div>
      </div>
    </section>
    <section class="card" id="signalPanel">
      <h3>Panel Sinyal</h3>
      <div id="signalEntry">Entry: —</div>
      <div id="signalSlTp">SL: — | TP: —</div>
      <button id="btnAction">Konfirmasi Action</button>
    </section>
  </main>

  <!-- Performa Backtest -->
  <main id="tab-backtest" class="tabpane" style="display:none">
    <section class="card">
      <h3>Statistik</h3>
      <div class="stats-grid">
        <div class="stat">PF: <span id="btPf">—</span></div>
        <div class="stat">Win Rate: <span id="btWinRate">—</span></div>
        <div class="stat">Max DD: <span id="btMaxDd">—</span></div>
        <div class="stat">Trades: <span id="btTrades">—</span></div>
      </div>
    </section>
    <section class="card">
      <canvas id="btChart"></canvas>
    </section>
  </main>

  <!-- Analisis MTF -->
  <main id="tab-mtf" class="tabpane" style="display:none">
    <section class="card">
      <h3>Multi-Timeframe Trend</h3>
      <div id="mtfTrend">Loading...</div>
    </section>
    <section class="card">
      <h3>Support/Resistance</h3>
      <div id="srTable">Loading...</div>
    </section>
  </main>

  <!-- Berita USD -->
  <main id="tab-news" class="tabpane" style="display:none">
    <section class="card">
      <h3>High-Impact USD News</h3>
      <div id="newsFeed">Memuat berita...</div>
    </section>
  </main>

  <script src="indicators.js"></script>
  <script src="backtest.js"></script>
  <script src="app.js"></script>
</body>
</html>
